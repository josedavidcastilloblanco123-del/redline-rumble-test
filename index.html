<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline Rumble 4</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #game { width: 800px; height: 600px; max-width: 100vw; background: #000; }
    p { margin: 0; font-size: 14px; text-align: center; padding: 0 16px; }
    a { color: #7cc4ff; }
  </style>
</head>
<body>
  <!-- A Shockwave emulator extension (e.g. DirPlayer) picks up this tag. -->
  <embed id="game" src="RR4.dcr" type="application/x-director" width="800" height="600">
  <p>Needs a Shockwave (.dcr) extension in Chrome.
     If nothing loads, open the file directly: <a href="RR4.dcr">RR4.dcr</a></p>
</body>
</html>
