name: inspect-zip

# Inspect only: fetch the zip on the runner and list its contents.
# Nothing is published or uploaded from this workflow.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install gdown
        run: pip install gdown

      - name: Fetch zip from Google Drive
        run: gdown "https://drive.google.com/uc?id=1nEmQfVV08R2RB-JhHdhHmoEiewLVA0tk" -O game.zip

      - name: Show file info
        run: |
          ls -l game.zip
          file game.zip
          sha256sum game.zip

      - name: List zip contents
        run: unzip -l game.zip

      - name: Show links.rtf
        run: unzip -p game.zip "redlinerumble4/links.rtf"

      - name: Look for external references in RR4.dcr
        run: |
          unzip -j game.zip "redlinerumble4/RR4.dcr" -d dcr
          head -c 64 dcr/RR4.dcr | xxd | head -n 4
          echo "--- strings matching url/cast/net keywords ---"
          strings -n 5 dcr/RR4.dcr | grep -iE "http|www\.|\.cst|\.cct|\.dcr|\.dxr|netLoad|getNetText|preloadNet|shockwave" | sort -u | head -n 60
