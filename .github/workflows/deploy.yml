name: deploy-pages

# Fetches the zip on the runner, keeps ONLY RR4.dcr (not the .exe),
# and publishes it with a small index.html to GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install gdown
        run: pip install gdown

      - name: Fetch zip from Google Drive
        run: gdown "https://drive.google.com/uc?id=1nEmQfVV08R2RB-JhHdhHmoEiewLVA0tk" -O game.zip

      - name: Build site (only RR4.dcr + index.html)
        run: |
          mkdir site
          unzip -j game.zip "redlinerumble4/RR4.dcr" -d site
          cp index.html site/
          ls -l site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
