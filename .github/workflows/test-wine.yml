name: test-wine

# Runs the codespace setup + run.sh inside the same devcontainer base image,
# on a virtual X screen, and reports whether the game window comes up.
# Only logs and a screenshot leave the runner; the game files are not uploaded.
on:
  workflow_dispatch:
  push:
    branches: [claude/redline-rumble-debug-wpmpry]
    paths: [".devcontainer/**", ".github/workflows/test-wine.yml"]

permissions:
  contents: write   # only to push the screenshot to a hidden ref (refs/wine-test/latest)

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: OS info
        run: cat /etc/os-release

      # Codespaces run lifecycle commands as the "vscode" user, so do the same.
      - name: Run setup.sh (same as postCreateCommand)
        run: |
          cp -r . /home/vscode/repo && chown -R vscode:vscode /home/vscode/repo
          sudo -u vscode -H bash -c 'cd ~/repo && bash .devcontainer/setup.sh > ~/setup.log 2>&1 || echo FAILED >> ~/setup.log'
          tail -n 15 /home/vscode/setup.log
          wine --version || true

      - name: Start virtual screen :1
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils imagemagick procps
          nohup Xvfb :1 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          sleep 3

      - name: Run run.sh (same as postStartCommand)
        run: |
          sudo -u vscode -H bash -c 'cd ~/repo && bash .devcontainer/run.sh'
          sleep 90
          DISPLAY=:1 import -window root /tmp/shot-1.png || true
          # Press Enter on whatever window is focused, then look again.
          sudo apt-get install -y --no-install-recommends xdotool >/dev/null
          DISPLAY=:1 xdotool key Return || true
          sleep 20
          DISPLAY=:1 import -window root /tmp/shot-2.png || true

      - name: Report
        if: always()
        run: |
          echo "--- processes"; ps aux | grep -iE "wine|RR4" | grep -v grep || true
          echo "--- windows"; DISPLAY=:1 xwininfo -root -tree | grep -vE 'has no name|^\s*$' | head -n 40 || true
          echo "--- wine.log"; tail -n 80 /home/vscode/wine.log || true
          DISPLAY=:1 import -window root /tmp/shot.png || true
          convert /tmp/shot.png -resize 512x /tmp/small.jpg || true
          echo "--- screenshot base64 begin"; base64 -w0 /tmp/small.jpg || true; echo; echo "--- screenshot base64 end"

      - name: Push screenshots to refs/wine-test/latest
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/out && cp /tmp/shot*.png /tmp/out/ 2>/dev/null || true
          tail -n 200 /home/vscode/wine.log > /tmp/out/wine.log 2>/dev/null || true
          DISPLAY=:1 xwininfo -root -tree > /tmp/out/windows.txt 2>&1 || true
          cd /tmp/out && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "wine test ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/wine-test/latest

      - name: Upload logs + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-test
          path: |
            /tmp/shot.png
            /home/vscode/setup.log
            /home/vscode/wine.log
